name: ${COMPOSE_PROJECT_NAME:-monad}

# Production-oriented default Compose file for MONAD.
#
# Public ports:
# - caddy: ${MONAD_HTTP_BIND:-127.0.0.1}:${MONAD_HTTP_PORT:-80} -> 8080/tcp
#
# Internal-only services:
# - admin: 8050/tcp on the Compose network
# - mysql: 3306/tcp on the Compose network
# - redis: 6379/tcp on the Compose network
#
# Security stance:
# - no Docker daemon socket mount in the default stack
# - no direct admin, MySQL, or Redis host ports
# - all host-side runtime data is stored under project-local folders
# - secrets are required from .env
# - optional host metrics collector is behind the "host-metrics" profile

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  admin:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/seclib/monad:${MONAD_IMAGE_TAG:-local}
    container_name: monad_admin

    extra_hosts:
      - "host.docker.internal:host-gateway"

    expose:
      - "${ADMIN_INTERNAL_PORT:-8050}"

    volumes:
      - ${MONAD_HOST_STORAGE_PATH:-./storage}:/app/storage
      - ${MONAD_HOST_LOGS_PATH:-./logs}:/app/logs
      - ${MONAD_HOST_CACHE_PATH:-./cache}:/app/cache
      # Runtime MONAD config must not be mounted over /app/config.
      # /app/config contains AdonisJS compiled application config files.
      - ${MONAD_HOST_CONFIG_PATH:-./config}:/app/runtime/config
      - ${MONAD_HOST_MODELS_PATH:-./models}:/app/models
      - ${MONAD_HOST_DATA_PATH:-./data}:/app/data

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${ADMIN_INTERNAL_PORT:-8050}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_AUTHOR: ${APP_AUTHOR:-seclib}
      PROJECT_NAME: ${PROJECT_NAME:-MONAD}
      PROJECT_REGION: ${PROJECT_REGION:-Reunion}
      PROJECT_TAGLINE: ${PROJECT_TAGLINE:-Optimisé pour La Réunion}
      PROJECT_DESCRIPTION: ${PROJECT_DESCRIPTION:-Système local de gestion et de connaissance}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-fr}
      APP_LOCALE: ${APP_LOCALE:-fr_FR}
      DATE_FORMAT: ${DATE_FORMAT:-DD/MM/YYYY}
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      URL: ${URL:-http://monad.local}
      HOST: 0.0.0.0
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-monad}
      DB_USER: ${DB_USER:-monad_user}
      DB_NAME: ${DB_NAME:-monad}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_SSL: ${DB_SSL:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: ${TZ:-Indian/Reunion}
      LANG: ${LANG:-fr_FR.UTF-8}
      LC_ALL: ${LC_ALL:-fr_FR.UTF-8}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-Tu es l'assistant IA de MONAD pour La Réunion. Tu réponds toujours en français clair, naturel et structuré, avec le contexte local de La Réunion lorsque c'est pertinent, sauf demande explicite contraire.}
      DISABLE_COMPRESSION: ${DISABLE_COMPRESSION:-false}
      MONAD_OFFLINE_MODE: ${MONAD_OFFLINE_MODE:-true}
      MONAD_API_URL: ${MONAD_API_URL:-https://api.monad.local}
      MONAD_BENCHMARK_API_URL: ${MONAD_BENCHMARK_API_URL:-https://benchmark.monad.local/api/v1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      MONAD_PROJECT_ROOT: ${MONAD_PROJECT_ROOT:-.}
      MONAD_STORAGE_PATH: ${MONAD_STORAGE_PATH:-storage}
      MONAD_LOGS_PATH: ${MONAD_LOGS_PATH:-logs}
      MONAD_CACHE_PATH: ${MONAD_CACHE_PATH:-cache}
      MONAD_CONFIG_PATH: ${MONAD_CONFIG_PATH:-runtime/config}
      MONAD_MODELS_PATH: ${MONAD_MODELS_PATH:-models}
      MONAD_DATA_PATH: ${MONAD_DATA_PATH:-data}
      MONAD_ENCRYPTION_KEY: ${MONAD_ENCRYPTION_KEY:-}
      MONAD_ENCRYPTION_PASSWORD: ${MONAD_ENCRYPTION_PASSWORD:-}
      VAULT_PATH: ${VAULT_PATH:-storage/vault}
      PMTILES_BINARY_PATH: ${PMTILES_BINARY_PATH:-bin/pmtiles}

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:${ADMIN_INTERNAL_PORT:-8050}/api/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    <<: *service-defaults
    image: ${CADDY_IMAGE:-caddy:2.8.4-alpine}
    container_name: monad_caddy
    command: ["caddy", "run", "--config", "/config/Caddyfile", "--adapter", "caddyfile"]

    # Only Caddy is exposed on the host.
    # Set MONAD_HTTP_BIND=0.0.0.0 to allow LAN access explicitly.
    ports:
      - "${MONAD_HTTP_BIND:-127.0.0.1}:${MONAD_HTTP_PORT:-80}:${CADDY_INTERNAL_PORT:-8080}"

    environment:
      CADDY_INTERNAL_PORT: ${CADDY_INTERNAL_PORT:-8080}
      ADMIN_INTERNAL_PORT: ${ADMIN_INTERNAL_PORT:-8050}

    volumes:
      - ${MONAD_HOST_CADDY_DATA_PATH:-./data/caddy/data}:/data
      - ${MONAD_HOST_CADDY_CONFIG_PATH:-./config/caddy}:/config

    depends_on:
      admin:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:${CADDY_INTERNAL_PORT:-8080}/api/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  mysql:
    <<: *service-defaults
    image: ${MYSQL_IMAGE:-mysql:8.0.40}
    container_name: monad_mysql
    command: ["--datadir=/data/mysql"]

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_DATABASE:-monad}
      MYSQL_USER: ${DB_USER:-monad_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

    volumes:
      - ${MONAD_HOST_MYSQL_DATA_PATH:-./data/mysql}:/data/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 10

  redis:
    <<: *service-defaults
    image: ${REDIS_IMAGE:-redis:7.4.1-alpine}
    container_name: monad_redis

    volumes:
      - ${MONAD_HOST_REDIS_DATA_PATH:-./data/redis}:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  disk-collector:
    <<: *service-defaults
    profiles:
      - host-metrics
    build:
      context: ./install/sidecar-disk-collector
      dockerfile: Dockerfile
    image: ghcr.io/seclib/monad-disk-collector:${MONAD_DISK_COLLECTOR_IMAGE_TAG:-local}
    container_name: monad_disk_collector
    read_only: true
    cap_drop:
      - ALL

    # Optional: project-local storage metrics.
    # Enable only when needed:
    #   docker compose --profile host-metrics up -d
    volumes:
      - ${MONAD_HOST_STORAGE_PATH:-./storage}:/app/storage:ro
      - ${MONAD_HOST_CACHE_PATH:-./cache}:/app/cache

    environment:
      MONAD_STORAGE_PATH: storage
      MONAD_CACHE_PATH: cache
